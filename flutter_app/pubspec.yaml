name: nostrfeed_mobile
description: "NostrFeed - Nostr Operating System for People, Creators & Communities"
publish_to: 'none'
version: 1.5.0+15

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & routing
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0

  # Nostr protocol
  web_socket_channel: ^3.0.1
  bech32: ^0.2.2
  bip340: ^0.3.0
  hex: ^0.2.0
  crypto: ^3.0.3
  pointycastle: ^4.0.0

  # Lightning / Wallets
  # QR code scanning. mobile_scanner is actively maintained and compatible
  # with modern AGP versions (qr_code_scanner is abandoned and breaks on AGP 8+).
  mobile_scanner: ^7.1.3

  # Local storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^11.2.0
  # SQLite — the normalized event store (posts/profiles/engagement live here,
  # not in JSON-in-SharedPreferences). Offline-first like X/FB/Insta.
  sqflite: ^2.4.4

  # Local push notifications (background listener like FB/Insta)
  flutter_local_notifications: ^19.5.0

  # Media & files
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  octo_image: ^2.1.2 # smooth image crossfade (avatars/photos fade in, no flicker)
  file_picker: ^13.1.0
  flutter_svg: ^2.0.10+1

  # HTTP & APIs
  http: ^1.2.1

  # UI utilities
  shimmer: ^3.0.0
  timeago: ^3.7.0
  url_launcher: ^6.3.0
  share_plus: ^13.3.1
  flutter_markdown: ^0.7.4
  qr_flutter: ^4.1.0
  photo_view: ^0.15.0
  intl: ^0.20.2
  uuid: ^4.5.1
  flutter_linkify: ^6.0.0
  video_player: ^2.14.1
  chewie: ^1.13.1
  path_provider: ^2.1.4
  connectivity_plus: ^7.3.1
  package_info_plus: ^10.2.2
  flutter_animate: ^4.5.2
  gal: ^2.3.3
  workmanager: ^0.10.10
  workmanager_android: ^0.10.9
  workmanager_platform_interface: ^0.10.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # In-memory SQLite for EventStore unit tests (deterministic, no device).
  sqflite_common_ffi: ^2.3.4+4
  # Swap `WorkmanagerPlatform.instance` for a fake in background_sync tests
  # (workmanager 0.10 is a federated Pigeon plugin — no MethodChannel to stub).
  # The fake must extend `WorkmanagerAndroid` so the Workmanager constructor's
  # `is! WorkmanagerAndroid` guard doesn't clobber it back to the real impl.
hooks:
  user_defines:
    sqlite3:
      source: process
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# shared_preferences_android 2.5.x rewrote the plugin on Pigeon JNI +
# DataStore — its plugin class doesn't compile into the app cleanly (the
# GeneratedPluginRegistrant can't find SharedPreferencesPlugin) and 2.5.0's
# JNI classes get R8-stripped (the "No instance with no name has been
# registered" crash). Pin the last stable pre-JNI line: 2.4.28 (the version
# before the Pigeon-JNI rewrite — battle-tested).
dependency_overrides:
  shared_preferences_android: 2.4.28

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/icons/

# App icon generation: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon-1024.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#2F6BFF"
  adaptive_icon_foreground: "assets/icon/icon-foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon-1024.png"
    background_color: "#2F6BFF"
    theme_color: "#2F6BFF"

# Native splash generation: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#2F6BFF"
  image: "assets/icon/splash-logo.png"
  color_dark: "#1A1025"
  image_dark: "assets/icon/splash-logo-dark.png"
  android_12:
    color: "#2F6BFF"
    image: "assets/icon/splash-logo.png"
    color_dark: "#1A1025"
    image_dark: "assets/icon/splash-logo-dark.png"
  android: true
  ios: true
  web: true
