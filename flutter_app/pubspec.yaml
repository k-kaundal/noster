name: nostrfeed_mobile
description: "NostrFeed - Nostr Operating System for People, Creators & Communities"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & routing
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0

  # Nostr protocol
  web_socket_channel: ^3.0.1
  bech32: ^0.2.2
  bip340: ^0.3.0
  hex: ^0.2.0
  crypto: ^3.0.3
  pointycastle: ^4.0.0

  # Lightning / Wallets
  # QR code scanning. mobile_scanner is actively maintained and compatible
  # with modern AGP versions (qr_code_scanner is abandoned and breaks on AGP 8+).
  mobile_scanner: ^7.1.3

  # Local storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Media & files
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  file_picker: ^10.1.2
  flutter_svg: ^2.0.10+1

  # HTTP & APIs
  http: ^1.2.1

  # UI utilities
  shimmer: ^3.0.0
  timeago: ^3.7.0
  url_launcher: ^6.3.0
  share_plus: ^10.1.2
  flutter_markdown: ^0.7.4
  qr_flutter: ^4.1.0
  photo_view: ^0.15.0
  intl: ^0.20.2
  uuid: ^4.5.1
  flutter_linkify: ^6.0.0
  video_player: ^2.14.1
  chewie: ^1.13.1
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# App icon generation: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon-1024.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#7C3AED"
  adaptive_icon_foreground: "assets/icon/icon-foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon-1024.png"
    background_color: "#7C3AED"
    theme_color: "#7C3AED"

# Native splash generation: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#7C3AED"
  image: "assets/icon/splash-logo.png"
  color_dark: "#1A1025"
  image_dark: "assets/icon/splash-logo-dark.png"
  android_12:
    color: "#7C3AED"
    image: "assets/icon/splash-logo.png"
    color_dark: "#1A1025"
    image_dark: "assets/icon/splash-logo-dark.png"
  android: true
  ios: true
  web: true
