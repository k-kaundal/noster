name: nostrfeed_mobile
description: "NostrFeed - Nostr Operating System for People, Creators & Communities"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & routing
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0

  # Nostr protocol
  nostr: ^2.0.0
  web_socket_channel: ^3.0.1
  bech32: ^0.2.2
  bip340: ^0.3.0
  hex: ^0.2.0
  crypto: ^3.0.3
  pointycastle: ^4.0.0

  # Local storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Media & files
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  file_picker: ^10.1.2
  mime: ^1.0.5

  # HTTP & APIs
  http: ^1.2.1

  # UI utilities
  shimmer: ^3.0.0
  timeago: ^3.7.0
  url_launcher: ^6.3.0
  share_plus: ^10.1.2
  flutter_markdown: ^0.7.4
  qr_flutter: ^4.1.0
  photo_view: ^0.15.0
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.5
  flutter_linkify: ^6.0.0
  linkify: ^5.0.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
